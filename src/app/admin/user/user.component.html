<div class="d-flex mb-3">

  <input type="text"
         class="form-control mr-2"
         placeholder="Search by name, username, email"
         [(ngModel)]="searchText"
         (keyup.enter)="search()">

  <button class="btn btn-primary mr-2" (click)="search()">
    Search
  </button>

  <button class="btn btn-outline-secondary"
          (click)="searchText=''; loadUsers()">
    Reset
  </button>

</div>


<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>User Management</h3>
    <button class="btn btn-primary" (click)="openForm()">
      <i class="fa fa-plus"></i> Create User
    </button>
  </div>

  <!-- USER TABLE -->
  <div class="card shadow-sm">
    <div class="card-body p-0">

      <table class="table table-hover mb-0">
        <thead class="thead-dark">
          <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Roles</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let u of users">
            <td>{{u.name}}</td>
            <td>{{u.username}}</td>
            <td>{{u.email}}</td>
            <td>
              <span class="badge bg-primary text-white me-1 mr-1"
                    *ngFor="let r of u.roles">
                {{r.name}}
              </span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-warning mr-2"
                      (click)="edit(u)">
                Edit
              </button>
              <button class="btn btn-sm btn-danger"
                      (click)="delete(u.id)">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="users.length === 0">
            <td colspan="5" class="text-center text-muted">
              No users found
            </td>
          </tr>

        </tbody>
      </table>

    </div>
  </div>

  <!-- FORM MODAL STYLE -->
  <div *ngIf="showForm" class="card shadow mt-4">

    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        {{isEdit ? 'Edit User' : 'Create User'}}
      </h5>
    </div>

    <div class="card-body">

      <div class="row">

        <div class="col-md-6">
          <label>Username</label>
          <input class="form-control" 
          disabled="{{isEdit}}"
                 [(ngModel)]="user.username">

        </div>

        <div class="col-md-6" *ngIf="!isEdit">
          <label>Password</label>
          <input type="password"
                 class="form-control"
                 [(ngModel)]="user.password">
        </div>

        <div class="col-md-6 mt-3">
          <label>Full Name</label>
          <input class="form-control"
                 [(ngModel)]="user.name">
        </div>

        <div class="col-md-6 mt-3">
          <label>Email</label>
          <input class="form-control"
                 [(ngModel)]="user.email">
        </div>
         <div class="col-md-6 mt-3">
          <label>Phone No</label>
          <input class="form-control"
                 [(ngModel)]="user.phone">
        </div>

        <!-- ROLE SELECT -->
        <div class="col-md-12 mt-3">
          <label>Roles</label>
          <select class="form-control"
                  multiple
                  [(ngModel)]="user.roleIds">

            <option *ngFor="let r of roles"
          [ngValue]="r.id">
             {{ r.name.replace('ROLE_', '') }}
            </option>
          </select>
        </div>

        <!-- SCHOLAR FIELD -->
        <div class="col-md-6 mt-3" *ngIf="isScholarSelected()">
          <label>Enrollment No</label>
          <input class="form-control"
                 [(ngModel)]="user.enrollmentNo">
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="mt-4 text-right">
        <button class="btn btn-success mr-2" (click)="save()">
          {{isEdit ? 'Update' : 'Save'}}
        </button>
        <button class="btn btn-secondary" (click)="showForm=false">
          Cancel
        </button>
      </div>

    </div>
  </div>

</div>
