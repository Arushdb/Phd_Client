<div class="card mb-3 shadow-sm">
  <div class="card-header bg-info text-white">
    <h5 class="mb-0">Achievements</h5>
  </div>

  <div class="card-body">

    <div *ngIf="loading" class="text-center">
      Loading achievements...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
    <div class="d-flex justify-content-end mb-3">
  <button
    type="button"
    [disabled]="!canEdit"
    class="btn btn-primary"
    (click)="addAchievementRow()">
    <i class="bi bi-plus-circle"></i> Add Achievement
  </button>
</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th style="min-width: 200px;">Awards</th>
            <th style="min-width: 200px;">Patents</th>
            <th style="min-width: 130px;">Teaching Hours</th>
            <th style="min-width: 160px;">Teaching Type</th>
            <th style="min-width: 150px;">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let achievement of achievements; let i = index">

            <td>
              <textarea
                class="form-control"
                [disabled]="!canEdit"
                rows="2"
                [(ngModel)]="achievement.awards"
                name="awards{{i}}"
                placeholder="Enter awards">
              </textarea>
            </td>

            <td>
              <textarea
                class="form-control"
                [disabled]="!canEdit"
                rows="2"
                [(ngModel)]="achievement.patents"
                name="patents{{i}}"
                placeholder="Enter patents">
              </textarea>
            </td>

            <td>
              <input
                type="number"
                [disabled]="!canEdit"
                class="form-control"
                [(ngModel)]="achievement.teachingHours"
                name="teachingHours{{i}}"
                min="0"
                step="1"
                placeholder="Hours">
            </td>

            <td>
              <input
                type="text"
                [disabled]="!canEdit"
                class="form-control"
                [(ngModel)]="achievement.teachingType"
                name="teachingType{{i}}"
                maxlength="50"
                placeholder="Teaching type">
            </td>

            <td>
              <div class="d-flex gap-2">
                <button
                  type="button"
                  [disabled]="!canEdit"
                  class="btn btn-sm btn-success"
                  
                  (click)="saveRow(i)">
                  {{ achievement.id ? 'Update' : 'Save' }}
                </button>

                <button
                  type="button"
                  [disabled]="!canEdit"
                  class="btn btn-sm btn-danger"
                  (click)="deleteRow(i)">
                  Delete
                </button>
              </div>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
