<div class="container-fluid mt-3">
  <div class="card shadow-sm">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">Conferences / Seminars / Courses</h5>
    </div>

    <div class="card-body">
       <div *ngIf="loading" class="text-center">
      Loading conferences...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-light text-center">
            <tr>
              <th>#</th>
              <th>Authors</th>
              <th>Title</th>
              <th>Type</th>
              <th>Level</th>
              <th>Organizer</th>
              <th>Place</th>
              <th>Dates</th>
              <th>Presentation</th>
              <th>Participation</th>
              <th>Funding</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let row of conferences; let i = index">
              <td class="text-center">{{ i + 1 }}</td>

              <td>
                <input [disabled]="!canEdit" class="form-control" [(ngModel)]="row.authors" />
              </td>

              <td>
                <input [disabled]="!canEdit" class="form-control" [(ngModel)]="row.title" />
              </td>

              <td>
                <select [disabled]="!canEdit" class="form-control" [(ngModel)]="row.type">
                  <option value="">Select</option>
                  <option>Conference</option>
                  <option>Seminar</option>
                  <option>Course</option>
                </select>
              </td>

              <td>
                <select [disabled]="!canEdit" class="form-control" [(ngModel)]="row.level">
                  <option value="">Select</option>
                  <option>International</option>
                  <option>National</option>
                </select>
              </td>

              <td>
                <input [disabled]="!canEdit" class="form-control" [(ngModel)]="row.organizer" />
              </td>

              <td>
                <input [disabled]="!canEdit" class="form-control" [(ngModel)]="row.place" />
              </td>

              <td>
                <input
                  type="text"
                  [disabled]="!canEdit"
                  class="form-control"
                  placeholder="DD-MM-YYYY"
                  [(ngModel)]="row.dates"
                />
              </td>

              <td>
                <select [disabled]="!canEdit" class="form-control" [(ngModel)]="row.presentationType">
                  <option value="">Select</option>
                  <option>Oral</option>
                  <option>Poster</option>
                </select>
              </td>

              <td>
                <select [disabled]="!canEdit" class="form-control" [(ngModel)]="row.participation">
                  <option value="">Select</option>
                  <option>Presented</option>
                  <option>Attended</option>
                </select>
              </td>

              <td>
                <input [disabled]="!canEdit" class="form-control" [(ngModel)]="row.funding" />
              </td>

              <td class="text-center">
                <button
                  [disabled]="!canEdit"
                  class="btn btn-success btn-sm me-2"
                  (click)="saveRow(i)"
                >
                  {{ row.id ? 'Update' : 'Save' }}
                </button>

                <button [disabled]="!canEdit" class="btn btn-danger btn-sm" (click)="deleteRow(i)">
                  Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-end mt-3">
        <button [disabled]="!canEdit" class="btn btn-outline-info" (click)="addRow()">
          + Add Entry
        </button>
      </div>
    </div>
  </div>
</div>
