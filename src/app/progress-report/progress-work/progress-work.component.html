
<div class="card mb-3">
  <div class="card-header bg-info text-white">
    Progress Work / Objectives
  </div>

  <div class="card-body">

    <div *ngIf="successMessage" class="alert alert-success">
  {{ successMessage }}
  <button type="button"
          class="btn-close"
          aria-label="Close"
          (click)="successMessage = ''">
  </button>
</div>

<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
  <button type="button"
          class="btn-close"
          aria-label="Close"
          (click)="errorMessage = ''">
  </button>
</div>

    <div *ngIf="!canEdit"
         class="alert alert-info">
      This progress report is locked.
      You cannot modify objectives.
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Sr. No.</th>
            <th>Stage</th>
            <th>Objective No.</th>
            <th>Completion (%)</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let work of progressWorks; let i = index">

            <td>{{ i + 1 }}</td>

            <td>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="work.stage"
                [disabled]="!canEdit"
                placeholder="Enter stage">
            </td>

            <td>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="work.objectiveNo"
                [disabled]="!canEdit"
                placeholder="Objective number">
            </td>

            <td>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="work.completionPercentage"
                [disabled]="!canEdit"
                min="0"
                max="100"
                placeholder="%">
            </td>

            <td>
              <div class="d-flex gap-1">

                <button
                  type="button"
                  class="btn btn-primary btn-sm"
                  [disabled]="!canEdit ||
                             !isRowComplete(work) ||
                             saving === i"
                  (click)="saveRow(i)">
                  {{ saving === i ? 'Saving...' :
                     work.id ? 'Update' : 'Save' }}
                </button>

                <button
                  type="button"
                  class="btn btn-danger btn-sm"
                  [disabled]="!canEdit || saving === i"
                  (click)="deleteRow(i)">
                  Delete
                </button>

              </div>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

    <button
      type="button"
      class="btn btn-success"
      [disabled]="!canEdit"
      (click)="addEmptyRow()">
      Add Objective
    </button>

  </div>
</div>
