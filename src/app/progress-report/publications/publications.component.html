
<div class="card mb-3 shadow-sm">
  <div class="card-header bg-info text-white">
    <h5 class="mb-0">Publications</h5>
  </div>

  <div class="card-body">

    <div *ngIf="loading" class="text-center">
      Loading publications...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <div class="text-end mb-3">
      <button
        type="button"
        class="btn btn-primary"
         [disabled]="!canEdit"
        (click)="addRow()">
        <i class="bi bi-plus-circle"></i> Add Publication
      </button>
    </div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th>Authors</th>
            <th>Title</th>
            <th>Journal</th>
            <th>Volume</th>
            <th>Page No.</th>
            <th>Year</th>
            <th>Impact</th>
            <th>Indexing</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of publications; let i = index">
            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.authors"
                name="authors{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.title"
                name="title{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.journal"
                name="journal{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit"   class="form-control"
                [(ngModel)]="row.volume"
                name="volume{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.pageNo"
                name="pageNo{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" type="number" class="form-control"
                [(ngModel)]="row.year"
                name="year{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.impact"
                name="impact{{i}}">
            </td>

            <td>
              <input [disabled]="!canEdit" class="form-control"
                [(ngModel)]="row.indexing"  
                name="indexing{{i}}">
            </td>

            <td>
              <div class="d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-sm btn-success"
                  [disabled]="!isRowValid(row) || !canEdit"
                  (click)="saveRow(i)">
                  {{ row.id ? 'Update' : 'Save' }}
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-danger"
                  [disabled]="!canEdit"
                  (click)="deleteRow(i)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
