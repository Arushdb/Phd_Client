<!-- ================= THREAD LIST ================= -->
<div class="mt-3" *ngFor="let t of threads">

  <div class="border p-3 mb-2 rounded">

    <!-- ROOT MESSAGE -->
    <div>
      <strong
        [ngClass]="{
          'text-primary': t.reviewerRole === 'SUPERVISOR',
          'text-success': t.reviewerRole === 'SCHOLAR',
          'text-danger': t.reviewerRole === 'DEAN'
        }">
        {{ t.role.name }}
      </strong>

      <span class="text-muted small ms-2">
        {{ t.remarkDate | date:'dd-MM-yyyy HH:mm' }}
      </span>

      <p class="mb-1 mt-1">{{ t.remarkText }}</p>
    </div>

    <!-- REPLIES -->
    <div *ngFor="let r of t.replies"
         class="border-start ps-3 mt-2 text-muted">

      <strong
        [ngClass]="{
          'text-primary': r.role.name === 'SUPERVISOR',
          'text-success': r.role.name === 'SCHOLAR',
          'text-danger': r.role.name === 'DEAN'
        }">
        {{ r.role.name }}
      </strong>

      <span class="small ms-2">
        {{ r.remarkDate | date:'dd-MM-yyyy HH:mm' }}
      </span>

      <p class="mb-1">{{ r.remarkText }}</p>
    </div>

    <!-- REPLY BOX -->
    <div class="mt-2">
      <input
        type="text"
        class="form-control form-control-sm"
        placeholder="Write a reply..."
        [(ngModel)]="replyForms[t.remarkId]" />

      <button
        class="btn btn-sm btn-outline-primary mt-1"
        (click)="reply(t.remarkId)">
        Reply
      </button>
    </div>

  </div>

</div>
